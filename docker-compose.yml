# Agent Swarm 本地多 Worker 演示
# 用法：docker compose up --scale worker=3
# 注意：worker 容器内跑 claude CLI 需要凭证（ANTHROPIC_API_KEY）。
#       本地快速验证推荐直接用 `npm run worker` 多开，无需 Docker。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["npx", "tsx", "src/server.ts"]
    ports:
      - "3013:3013"
    environment:
      PORT: 3013
      API_KEY: dev-123123
      DB_PATH: /data/agent-swarm.sqlite
    volumes:
      - swarm-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3013/api/health"]
      interval: 10s
      timeout: 3s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:3013
      API_KEY: dev-123123
      AGENT_CLI: claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # 若本机已有 ~/.claude 登录态，可挂载进容器
    # volumes:
    #   - ${HOME}/.claude:/root/.claude

volumes:
  swarm-data:
